[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anla"
version = "0.1.0"
description = "Reference implementation of the Agent-Native Lossless Archive — readable, dependency-light, and slower than the Rust writer by design"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Neo.K" }]
keywords = ["archive", "lossless", "deduplication", "content-addressed", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Compression",
]
dependencies = []

# What this package is, so nobody has to measure it to find out.
#
# It is the *reference* implementation: dependency-light, readable, and the
# executable half of the specification. `anla/fastcdc.py` says of its own inner loop
# that it is "the last place to be clever", and that is deliberate — a stranger has
# to be able to audit the rule that decides where chunks begin.
#
# The cost is measured and published at https://anla.evemisslab.com/bench/ :
# with content-defined chunking, which is the default because fixed chunking
# destroys deduplication, this writer packs at **3.8 MiB/s** where the Rust writer
# does the identical work — byte-identical, checked in CI — at **107.3 MiB/s**.
# Reading is unaffected at ~538 MiB/s, because verification hashes whole chunks
# rather than walking bytes.
#
# The Rust figure was 87.5 here until 2026-08-15, and it was wrong: the benchmark
# invoked that writer with `--chunking anla-cdc-1`, a value neither CLI has ever
# accepted, so it measured Rust doing *fixed* chunking against Python doing CDC.
#
# So: use this to read archives, to check the format, to embed in Python, and for
# trees measured in megabytes. Use `anla1-rs` from the same repository for volume.
# The two produce the same bytes; only one of them is worth an afternoon.

[project.optional-dependencies]
dev = ["pytest>=8.0", "blake3>=1.0", "zstandard>=0.22"]
# The Rust BLAKE3 is a fast path, never a requirement: anla1.blake3 carries a
# readable pure-Python reference, and the suite asserts the two agree. A format
# whose hash is only available as a compiled wheel cannot be checked by reading.
speed = ["blake3>=1.0"]
# Unlike BLAKE3, there is no pure-Python fallback for this one and there is not
# going to be: zstd is not something to reimplement for a specification's
# readability. An archive that uses it declares anla:codec:zstd:1 as *required*, and
# a reader without the library refuses cleanly rather than guessing.
zstd = ["zstandard>=0.22"]

[project.scripts]
anla = "anla.cli:main"
# A separate command, not a flag on `anla`, for the same reason 1.0 has its own
# magic number: one command switching profiles on a flag invites an archive written
# under one and read under the other.
anla1 = "anla1.cli:main"

[project.urls]
Homepage = "https://anla.evemisslab.com"
Source = "https://github.com/kakon77777-commits/anla"
Specification = "https://anla.evemisslab.com/spec/"

[tool.setuptools.packages.find]
include = ["anla*", "anla1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

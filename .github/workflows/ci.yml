name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows folds case and macOS folds Unicode normalization. Both are
        # required here: the collision tests only mean something on a filesystem
        # that actually folds, and a green Linux run proves nothing about either.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Report the runtime
        shell: bash
        run: |
          python -c "import sys; print('python', sys.version)"
          node -e "console.log('node', process.version, 'CompressionStream', typeof CompressionStream)"

      - name: Install
        run: python -m pip install --upgrade pip pytest pyflakes blake3 zstandard

      - name: Lint
        run: python -m pyflakes python/anla python/anla1 python/tests conformance/make_vectors.py site tools bench test_demo

      - name: Conformance suite
        # -ra reports skips. Without it a module that skipped itself — the BLAKE3
        # cross-check does exactly that when the Rust wheel is missing — is
        # indistinguishable from one that passed, and a green run would prove less
        # than it appears to.
        run: python -m pytest python/tests -q -ra

      - name: Both BLAKE3 paths are present
        # Asserted rather than inferred from a green suite: the cross-check module
        # skips itself when the extension is absent, so this is what makes "the two
        # implementations agree" a claim about this run rather than some other one.
        run: python tools/check_blake3.py

      - name: zstd is present and still behaves as the reader assumes
        # Same hole as the BLAKE3 check: test_codecs_1_0.py skips itself without the
        # library, and a skipped module looks exactly like a passing one. This also
        # re-asserts that a frame declares its content size, because that header is
        # what the bomb check reads.
        run: python tools/check_zstd.py

      - name: Published test counts match the suite
        # The landing page said 201 while the suite had 603, for weeks, because the
        # number lived in four places and was hand-edited in three of them. Checked
        # here rather than remembered — it is the first figure a reader checks and
        # the one that decides whether they believe the rest.
        run: python tools/check_counts.py

      - name: Frozen vectors match the writer
        run: python conformance/make_vectors.py --check --json

      - name: JavaScript self-test
        run: node conformance/run_node.mjs selftest

      - name: Differential fuzzing
        # The suite already runs a bounded version; this is a longer pass on a
        # seed derived from the run number, so the space keeps being searched
        # rather than the same 240 mutants being re-checked forever.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python tools/fuzz_differential.py -n 3000 --seed ${{ github.run_number }} --json --keep

      - name: Keep any fuzz findings
        # Code mismatches do not fail the run — they may be specification gaps, and
        # triage belongs to a person. They still have to leave the machine, or the
        # job below would be reporting on an artifact nobody produced.
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: conformance/fuzz-findings
          if-no-files-found: ignore
          retention-days: 30

      - name: CLI smoke test
        shell: bash
        run: |
          python -m pip install -e python
          anla --version
          anla pack conformance -o /tmp/conf.anla --exclude 'out*/**' --json
          anla verify /tmp/conf.anla --json
          anla list /tmp/conf.anla | head -5
          anla extract /tmp/conf.anla --to /tmp/restored --json > /dev/null
          anla export /tmp/conf.anla -o /tmp/conf.zip --json

      - name: 1.0 CLI smoke test
        shell: bash
        # Snapshot 2 of an unchanged tree must add no chunk records, and every
        # snapshot must still restore its own tree. Run against a real directory
        # rather than a fixture, because the filesystem layer is the part the
        # in-memory tests cannot reach.
        run: |
          anla1 --version
          anla1 pack conformance -o /tmp/one.anla --exclude 'out*/**' --json
          before=$(stat -c%s /tmp/one.anla 2>/dev/null || stat -f%z /tmp/one.anla)
          anla1 append /tmp/one.anla conformance --exclude 'out*/**' --json
          after=$(stat -c%s /tmp/one.anla 2>/dev/null || stat -f%z /tmp/one.anla)
          anla1 snapshots /tmp/one.anla
          anla1 verify /tmp/one.anla --json
          anla1 diff /tmp/one.anla
          anla1 extract /tmp/one.anla --to /tmp/snap1 -s 1 --json > /dev/null
          anla1 extract /tmp/one.anla --to /tmp/snap2 --json > /dev/null
          diff -r /tmp/snap1 /tmp/snap2
          python - "$before" "$after" <<'PY'
          import sys
          before, after = int(sys.argv[1]), int(sys.argv[2])
          grew = after - before
          # A manifest and a footer, not a second copy of the tree.
          assert 0 < grew < before // 4, f"an unchanged tree cost {grew} of {before}"
          print(f"second snapshot of an unchanged tree cost {grew} bytes on {before}")
          PY

      - name: The real corpus round-trips on this platform
        shell: bash
        # test_demo/ holds files a person actually wants to keep, starting with
        # this project's own papers. Everything else in the suite tests the format
        # against inputs the suite invented; this asks whether real bytes survive,
        # on every platform, which is the only question that finally matters.
        run: python test_demo/run.py

      - name: Reproducible across two runs of the 1.0 writer
        shell: bash
        # The property the freeze rule is stated in terms of. Asserted on every
        # platform, because a byte difference that only appears on Windows is
        # exactly the kind a second implementation would inherit.
        #
        # `--no-metadata` is not a way of making the check pass; it is what the
        # check is actually about. Recorded metadata is part of what an archive
        # preserves, so it belongs in the hash — and the platforms genuinely differ
        # about it. A checkout sets mtimes to the moment it ran, and POSIX records a
        # file mode where Windows has none to record. Writing a synthetic mode on
        # Windows would store a fact that was never true.
        #
        # So the four POSIX jobs agreeing with each other while Windows differed was
        # this check working, not failing, and it has now taught us the same lesson
        # twice: "same input" for this format means same names, same content, same
        # recorded metadata, and a fixed (uuid, timestamp). Content and names are
        # what a second implementation can be held to on any platform.
        run: |
          # The frozen vectors, not a source directory: importing anla1 can write
          # __pycache__ between the two runs, which would make this fail for a
          # reason that has nothing to do with the writer.
          for n in a b; do
            anla1 pack conformance/vectors -o /tmp/repro-$n.anla --no-metadata \
              --uuid 00112233445566778899aabbccddeeff \
              --created-ns 1785000000000000000 --json > /dev/null
          done
          cmp /tmp/repro-a.anla /tmp/repro-b.anla
          echo "two runs of the 1.0 writer produced identical bytes"
          # The path goes through argv, not inside the Python source, and the digest
          # lands in the workspace rather than /tmp. Both are Windows: Git Bash
          # rewrites a POSIX path that appears as an *argument* to a native program,
          # and leaves one embedded in a quoted string alone — so Python read
          # `\tmp\repro-a.anla` and found nothing. upload-artifact has the same
          # problem with a /tmp path, being a Node action rather than a shell one.
          python -c "import hashlib,pathlib,sys; \
            print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())" \
            /tmp/repro-a.anla > repro-digest.txt
          cat repro-digest.txt

      - name: Keep this platform's reproducible digest
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.os }}-py${{ matrix.python }}
          path: repro-digest.txt

  encoding:
    name: text I/O declares an encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No open() or read_text() without encoding=
        run: python tools/check_encoding.py

  benchmark:
    name: the numbers can still be measured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the git-history scenario needs the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip blake3 zstandard
      - name: Run the whole benchmark
        # Runs it rather than trusting the committed results, so the harness cannot
        # rot between milestones and be discovered broken on the day the numbers are
        # wanted. Staleness is a separate question and a visible one: the published
        # page stamps the revision its figures came from.
        run: python bench/run_bench.py -o /tmp/fresh.json
      - name: Every scenario produced a number
        run: |
          python - <<'PY'
          import json, pathlib, sys
          fresh = json.loads(pathlib.Path("/tmp/fresh.json").read_text(encoding="utf-8"))
          published = json.loads(pathlib.Path("bench/results.json").read_text(encoding="utf-8"))
          names = {r["scenario"] for r in fresh["results"]}
          if not names:
              sys.exit("the harness produced no scenarios")
          for result in fresh["results"]:
              # Not every scenario measures an archive size — `throughput` measures
              # rates. What every scenario must produce is *some* measurement, and
              # asking for `anla_1_0` specifically was the third place in this
              # feature that assumed one shape for all rows, after the summary
              # printer and the page renderer. The guard's purpose is to catch a
              # scenario that silently produced nothing, and it still does.
              measured = result["sizes"].get("anla_1_0") or result["detail"]
              if not measured:
                  sys.exit(f"{result['scenario']} produced no measurement at all")
          missing = names - {r["scenario"] for r in published["results"]}
          if missing:
              sys.exit(f"bench/results.json does not cover {sorted(missing)} — "
                       f"regenerate it with `python bench/run_bench.py`")
          print(f"{len(names)} scenarios measured: {', '.join(sorted(names))}")
          PY

  two-implementations:
    name: python and rust agree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip blake3 zstandard
      - name: Build the Rust reader
        working-directory: rust
        run: cargo build --release --locked

      - name: Rust unit tests
        working-directory: rust
        # The canonical CBOR refusals, which the fuzzer reaches slowly: a
        # non-shortest integer and a map one byte out of order are narrow targets in
        # a large space, and "canonical" is a set of refusals rather than a
        # behaviour — a decoder that quietly accepts looks correct until something
        # depends on the difference.
        run: cargo test --release --locked

      - name: It agrees with its own pinned values
        run: ./rust/target/release/anla1-rs selftest
        shell: bash

      - name: It verifies an archive the Python writer produced
        shell: bash
        # The whole point of the freeze rule, run on three operating systems. Two
        # readers, no shared code below `blake3` and `zstd`, recomputing every
        # Merkle root and every hash from the same bytes.
        run: |
          python -m pip install -e python
          anla1 pack test_demo -o /tmp/corpus.anla --chunk-avg 4096             --exclude '_out/**' --exclude '__pycache__/**' --json > /dev/null
          ./rust/target/release/anla1-rs verify /tmp/corpus.anla
          ./rust/target/release/anla1-rs extract /tmp/corpus.anla > /tmp/rust.json
          python tools/compare_implementations.py /tmp/corpus.anla /tmp/rust.json

      - name: Two writers, one tree, the same bytes
        shell: bash
        # The freeze rule's other clause. `store` must be byte-identical: canonical
        # CBOR, object ordering, chunk boundaries, record framing and Merkle roots
        # all have to agree exactly, and any one of them disagreeing moves an offset.
        #
        # `zstd` is reported and does not fail, because §8 predicts it: compressed
        # output is a function of the compressor, and the Rust `zstd` crate and the
        # Python `zstandard` wheel do not necessarily bundle the same libzstd. What
        # must match under any codec is `objects_root` and the chunk-id set, which
        # is what gets checked there instead. On a machine where both link the same
        # library the bytes match too, and the run says which case it saw.
        run: python tools/compare_writers.py test_demo

      - name: The two implementations derive one path from one native name
        # Only the *reader* is compared here, and deliberately: the Rust writer does
        # not emit native names, so there is nothing to compare byte for byte. What
        # can be compared is the rule — Python writes an archive whose paths are its
        # names' derivations, Rust recomputes each one and refuses any that differs.
        # The two arrive by different routes (surrogate decoding against a byte
        # walk), which is what makes agreement mean the rule is written tightly
        # enough for two people to implement. The run ends with a forged archive
        # Rust must refuse, so a pass cannot be vacuous.
        run: python tools/compare_names.py

      - name: The MCP server answers a client
        # Spoken to over stdio as a real client does, not imported and called.
        # That distinction is the whole reason this step exists: the error-handling
        # decorator was once written without `functools.wraps`, so every tool
        # advertised `required: ["args", "kwargs"]` — each function worked perfectly
        # when called directly and no client could have called one of them.
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Pinned below 2.0: `mcp` 2.0 moved `mcp.server.fastmcp`, which an
          # unpinned install found the hard way. The version is printed so the next
          # version problem names itself instead of arriving as a bare
          # ModuleNotFoundError.
          python -m pip install --quiet "mcp>=1.10,<2"
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
          python tools/mcp/test_mcp.py

      - name: Every single-member manifest edit, both readers
        # Enumeration rather than sampling. The fuzzer reaches these rules now, but
        # randomly and from a corpus built out of the working tree — so a finding on
        # Linux was not reproducible on Windows, which is exactly what happened. This
        # deletes, renames and retypes every member of the manifest, of an object and
        # of a chunk descriptor, repairs every hash and root so only the rules can
        # refuse the result, and compares. Its first run: 65 disagreements in 179
        # cases. It fails if any remain, and also if too few edits were refused at
        # all, because agreement about nothing is not agreement.
        run: python tools/compare_manifest_rules.py

      - name: Differential fuzzing, python against rust
        # The tool that found the missing section 4.3 check within three hundred
        # mutants. Seeded from the run number so the space keeps being searched
        # rather than the same mutants re-checked forever.
        if: matrix.os == 'ubuntu-latest'
        run: python tools/fuzz_1_0.py -n 3000 --seed ${{ github.run_number }} --json --keep

      - name: Keep any 1.0 fuzz findings
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-1.0-findings
          path: conformance/fuzz-1.0-findings
          if-no-files-found: ignore
          retention-days: 30

  site:
    name: site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build prints how many commits behind HEAD the published benchmark
          # numbers are. A shallow clone cannot compute that and it degrades to "?"
          # — silently, in exactly the environment where the indicator is most
          # useful, which is the failure mode the indicator was built to avoid.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: python site/build.py
      - name: The deployed core is the tested core
        run: |
          python - <<'PY'
          import hashlib, pathlib
          a = pathlib.Path("web/anla-core.js").read_bytes()
          b = pathlib.Path("site/dist/assets/anla-core.js").read_bytes()
          assert a == b, "site/dist/assets/anla-core.js differs from web/anla-core.js"
          print("core sha256", hashlib.sha256(a).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7

  reproducible-everywhere:
    name: one archive, six platforms, one digest
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repro-*
          path: digests
      - name: Every platform wrote the same bytes
        # Each job already proves it repeats itself. This proves they agree with
        # each other, which is the property the freeze rule is actually about —
        # "two independent implementations produce byte-identical archives" is
        # meaningless if one implementation cannot manage it across three operating
        # systems first. A line ending, a path separator or a directory order that
        # leaked into the output would show up here and nowhere else.
        run: |
          python - <<'PY'
          import pathlib, sys
          seen = {}
          for f in sorted(pathlib.Path("digests").rglob("repro-digest.txt")):
              seen.setdefault(f.read_text(encoding="utf-8").strip(), []).append(f.parent.name)
          for digest, where in sorted(seen.items()):
              print(f"{digest[:16]}  {', '.join(sorted(where))}")
          if len(seen) != 1:
              sys.exit("the 1.0 writer produced different bytes on different platforms")
          if sum(len(w) for w in seen.values()) < 6:
              sys.exit(f"expected six platforms, got {sum(len(w) for w in seen.values())}")
          print("all six platforms agree, byte for byte")
          PY

  fuzz-findings:
    name: fuzz findings, if any
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fuzz-findings
          path: findings
      - name: Show anything the fuzzer kept
        run: |
          if [ -d findings ] && [ -n "$(ls -A findings 2>/dev/null)" ]; then
            echo "findings were written — these are code mismatches, which do not"
            echo "fail the run but do need triage:"
            cat findings/*.json
          else
            echo "no findings"
          fi

  distributables:
    # Build what a release would publish, on every push, and prove the built
    # artifact works rather than merely that it built. Publishing has never been
    # rehearsed here — `pypi.org/project/anla/` is 404 and the crate is
    # unpublished — and an unrehearsed release step is one that fails on the day it
    # matters, with an audience.
    #
    # The wheel is checked by *installing it into a clean environment and using it*.
    # Building a wheel proves setuptools ran; a round trip through the installed
    # console script proves a stranger can pack and get their bytes back, which is
    # the only claim worth making.
    name: what a release would ship (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the Python distributions
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist --outdir ../dist

      - name: Install the wheel into a clean environment and use it
        shell: bash
        run: |
          set -e
          python -m venv /tmp/anla-clean || python -m venv "$RUNNER_TEMP/anla-clean"
          root="${RUNNER_TEMP:-/tmp}/anla-clean"
          [ -d "$root" ] || root=/tmp/anla-clean
          bin="$root/bin"; [ -d "$bin" ] || bin="$root/Scripts"
          "$bin/python" -m pip install --quiet --upgrade pip
          # `[speed,zstd]` because that is what a user who wants it to work installs,
          # and because the pure-Python fallbacks would otherwise be the only thing
          # this ever exercised.
          "$bin/python" -m pip install --quiet "$(ls dist/*.whl)[speed,zstd]"
          mkdir -p smoke/src && printf 'hello\n' > smoke/src/a.txt
          printf 'and a second file\n' > smoke/src/b.txt
          "$bin/anla1" pack smoke/src -o smoke/out.anla
          "$bin/anla1" verify smoke/out.anla
          "$bin/anla1" extract smoke/out.anla --to smoke/back
          diff -r smoke/src smoke/back
          echo "the installed wheel packs, verifies and restores byte for byte"

      - name: Build the Rust binary a release would attach
        working-directory: rust
        run: cargo build --release --locked

      - name: The binary runs and agrees with the wheel
        shell: bash
        run: |
          set -e
          binary=rust/target/release/anla1-rs
          [ -f "$binary" ] || binary=rust/target/release/anla1-rs.exe
          "$binary" verify smoke/out.anla
          echo "the Rust binary reads what the Python wheel wrote"

      - uses: actions/upload-artifact@v4
        with:
          name: distributables-${{ matrix.os }}
          path: |
            dist/*
            rust/target/release/anla1-rs
            rust/target/release/anla1-rs.exe
          if-no-files-found: error
          retention-days: 30

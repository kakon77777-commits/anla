name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows folds case and macOS folds Unicode normalization. Both are
        # required here: the collision tests only mean something on a filesystem
        # that actually folds, and a green Linux run proves nothing about either.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Report the runtime
        shell: bash
        run: |
          python -c "import sys; print('python', sys.version)"
          node -e "console.log('node', process.version, 'CompressionStream', typeof CompressionStream)"

      - name: Install
        run: python -m pip install --upgrade pip pytest pyflakes blake3

      - name: Lint
        run: python -m pyflakes python/anla python/anla1 python/tests conformance/make_vectors.py site tools

      - name: Conformance suite
        # -ra reports skips. Without it a module that skipped itself — the BLAKE3
        # cross-check does exactly that when the Rust wheel is missing — is
        # indistinguishable from one that passed, and a green run would prove less
        # than it appears to.
        run: python -m pytest python/tests -q -ra

      - name: Both BLAKE3 paths are present
        # Asserted rather than inferred from a green suite: the cross-check module
        # skips itself when the extension is absent, so this is what makes "the two
        # implementations agree" a claim about this run rather than some other one.
        run: python tools/check_blake3.py

      - name: Published test counts match the suite
        # The landing page said 201 while the suite had 603, for weeks, because the
        # number lived in four places and was hand-edited in three of them. Checked
        # here rather than remembered — it is the first figure a reader checks and
        # the one that decides whether they believe the rest.
        run: python tools/check_counts.py

      - name: Frozen vectors match the writer
        run: python conformance/make_vectors.py --check --json

      - name: JavaScript self-test
        run: node conformance/run_node.mjs selftest

      - name: Differential fuzzing
        # The suite already runs a bounded version; this is a longer pass on a
        # seed derived from the run number, so the space keeps being searched
        # rather than the same 240 mutants being re-checked forever.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python tools/fuzz_differential.py -n 3000 --seed ${{ github.run_number }} --json --keep

      - name: Keep any fuzz findings
        # Code mismatches do not fail the run — they may be specification gaps, and
        # triage belongs to a person. They still have to leave the machine, or the
        # job below would be reporting on an artifact nobody produced.
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: conformance/fuzz-findings
          if-no-files-found: ignore
          retention-days: 30

      - name: CLI smoke test
        shell: bash
        run: |
          python -m pip install -e python
          anla --version
          anla pack conformance -o /tmp/conf.anla --exclude 'out*/**' --json
          anla verify /tmp/conf.anla --json
          anla list /tmp/conf.anla | head -5
          anla extract /tmp/conf.anla --to /tmp/restored --json > /dev/null
          anla export /tmp/conf.anla -o /tmp/conf.zip --json

      - name: 1.0 CLI smoke test
        shell: bash
        # Snapshot 2 of an unchanged tree must add no chunk records, and every
        # snapshot must still restore its own tree. Run against a real directory
        # rather than a fixture, because the filesystem layer is the part the
        # in-memory tests cannot reach.
        run: |
          anla1 --version
          anla1 pack conformance -o /tmp/one.anla --exclude 'out*/**' --json
          before=$(stat -c%s /tmp/one.anla 2>/dev/null || stat -f%z /tmp/one.anla)
          anla1 append /tmp/one.anla conformance --exclude 'out*/**' --json
          after=$(stat -c%s /tmp/one.anla 2>/dev/null || stat -f%z /tmp/one.anla)
          anla1 snapshots /tmp/one.anla
          anla1 verify /tmp/one.anla --json
          anla1 diff /tmp/one.anla
          anla1 extract /tmp/one.anla --to /tmp/snap1 -s 1 --json > /dev/null
          anla1 extract /tmp/one.anla --to /tmp/snap2 --json > /dev/null
          diff -r /tmp/snap1 /tmp/snap2
          python - "$before" "$after" <<'PY'
          import sys
          before, after = int(sys.argv[1]), int(sys.argv[2])
          grew = after - before
          # A manifest and a footer, not a second copy of the tree.
          assert 0 < grew < before // 4, f"an unchanged tree cost {grew} of {before}"
          print(f"second snapshot of an unchanged tree cost {grew} bytes on {before}")
          PY

      - name: Reproducible across two runs of the 1.0 writer
        shell: bash
        # The property the freeze rule is stated in terms of. Asserted on every
        # platform, because a byte difference that only appears on Windows is
        # exactly the kind a second implementation would inherit.
        #
        # `--no-mtime` is not a way of making the check pass. Recorded metadata is
        # part of what an archive preserves, so it belongs in the hash — and a
        # checkout sets mtimes to the moment it ran, which is different in every
        # job. Without this the step would be comparing archives of six different
        # inputs. "Same input" for this format means same names, same content, same
        # recorded metadata, and a fixed (uuid, timestamp): the first run of this
        # check is what made that sentence precise.
        run: |
          # The frozen vectors, not a source directory: importing anla1 can write
          # __pycache__ between the two runs, which would make this fail for a
          # reason that has nothing to do with the writer.
          for n in a b; do
            anla1 pack conformance/vectors -o /tmp/repro-$n.anla --no-mtime \
              --uuid 00112233445566778899aabbccddeeff \
              --created-ns 1785000000000000000 --json > /dev/null
          done
          cmp /tmp/repro-a.anla /tmp/repro-b.anla
          echo "two runs of the 1.0 writer produced identical bytes"
          # The path goes through argv, not inside the Python source, and the digest
          # lands in the workspace rather than /tmp. Both are Windows: Git Bash
          # rewrites a POSIX path that appears as an *argument* to a native program,
          # and leaves one embedded in a quoted string alone — so Python read
          # `\tmp\repro-a.anla` and found nothing. upload-artifact has the same
          # problem with a /tmp path, being a Node action rather than a shell one.
          python -c "import hashlib,pathlib,sys; \
            print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())" \
            /tmp/repro-a.anla > repro-digest.txt
          cat repro-digest.txt

      - name: Keep this platform's reproducible digest
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.os }}-py${{ matrix.python }}
          path: repro-digest.txt

  encoding:
    name: text I/O declares an encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No open() or read_text() without encoding=
        run: python tools/check_encoding.py

  benchmark:
    name: the numbers can still be measured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the git-history scenario needs the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip blake3
      - name: Run the whole benchmark
        # Runs it rather than trusting the committed results, so the harness cannot
        # rot between milestones and be discovered broken on the day the numbers are
        # wanted. Staleness is a separate question and a visible one: the published
        # page stamps the revision its figures came from.
        run: python bench/run_bench.py -o /tmp/fresh.json
      - name: Every scenario produced a number
        run: |
          python - <<'PY'
          import json, pathlib, sys
          fresh = json.loads(pathlib.Path("/tmp/fresh.json").read_text(encoding="utf-8"))
          published = json.loads(pathlib.Path("bench/results.json").read_text(encoding="utf-8"))
          names = {r["scenario"] for r in fresh["results"]}
          if not names:
              sys.exit("the harness produced no scenarios")
          for result in fresh["results"]:
              if not result["sizes"].get("anla_1_0"):
                  sys.exit(f"{result['scenario']} produced no ANLA size")
          missing = names - {r["scenario"] for r in published["results"]}
          if missing:
              sys.exit(f"bench/results.json does not cover {sorted(missing)} — "
                       f"regenerate it with `python bench/run_bench.py`")
          print(f"{len(names)} scenarios measured: {', '.join(sorted(names))}")
          PY

  site:
    name: site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: python site/build.py
      - name: The deployed core is the tested core
        run: |
          python - <<'PY'
          import hashlib, pathlib
          a = pathlib.Path("web/anla-core.js").read_bytes()
          b = pathlib.Path("site/dist/assets/anla-core.js").read_bytes()
          assert a == b, "site/dist/assets/anla-core.js differs from web/anla-core.js"
          print("core sha256", hashlib.sha256(a).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 7

  reproducible-everywhere:
    name: one archive, six platforms, one digest
    needs: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: repro-*
          path: digests
      - name: Every platform wrote the same bytes
        # Each job already proves it repeats itself. This proves they agree with
        # each other, which is the property the freeze rule is actually about —
        # "two independent implementations produce byte-identical archives" is
        # meaningless if one implementation cannot manage it across three operating
        # systems first. A line ending, a path separator or a directory order that
        # leaked into the output would show up here and nowhere else.
        run: |
          python - <<'PY'
          import pathlib, sys
          seen = {}
          for f in sorted(pathlib.Path("digests").rglob("repro-digest.txt")):
              seen.setdefault(f.read_text(encoding="utf-8").strip(), []).append(f.parent.name)
          for digest, where in sorted(seen.items()):
              print(f"{digest[:16]}  {', '.join(sorted(where))}")
          if len(seen) != 1:
              sys.exit("the 1.0 writer produced different bytes on different platforms")
          if sum(len(w) for w in seen.values()) < 6:
              sys.exit(f"expected six platforms, got {sum(len(w) for w in seen.values())}")
          print("all six platforms agree, byte for byte")
          PY

  fuzz-findings:
    name: fuzz findings, if any
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fuzz-findings
          path: findings
      - name: Show anything the fuzzer kept
        run: |
          if [ -d findings ] && [ -n "$(ls -A findings 2>/dev/null)" ]; then
            echo "findings were written — these are code mismatches, which do not"
            echo "fail the run but do need triage:"
            cat findings/*.json
          else
            echo "no findings"
          fi

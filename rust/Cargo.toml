[package]
name = "anla1"
version = "0.1.1"
edition = "2021"
description = "An independent reader and writer for ANLA 1.0 (draft), written against SPEC-1.0-DRAFT.md — byte-identical to the Python implementation it shares no code with"
license = "Apache-2.0"
repository = "https://github.com/kakon77777-commits/anla"
homepage = "https://anla.evemisslab.com"
readme = "README.md"
keywords = ["archive", "lossless", "deduplication", "cbor"]
categories = ["compression", "filesystem"]

[[bin]]
name = "anla1-rs"
path = "src/main.rs"

[dependencies]
# Only the two primitives the format names. Everything the specification actually
# defines — the canonical CBOR profile, the container, the Merkle construction — is
# written here rather than pulled in, because a second implementation that imported
# someone else's CBOR crate would be testing that crate's idea of CBOR rather than
# the rules this format wrote down.
blake3 = "1"
zstd = "0.13"

[profile.release]
overflow-checks = true
